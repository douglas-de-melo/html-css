<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../doug.ico" type="image/x-icon">
    <link rel="stylesheet" href="estilos/style.css" media="all">
    <link rel="stylesheet" href="estilos/media-queries.css">
    <title>Media Query</title>
</head>

<!--
    "Mobile first" é uma estratégia de design e desenvolvimento onde você começa criando um site ou aplicação para dispositivos móveis (telas pequenas) antes de pensar nas versões para telas maiores (tablet e desktop).
    -> A lógica é: se o layout funciona bem no celular (que tem mais restrições de espaço, performance e usabilidade), será mais fácil adaptá-lo para telas maiores.
-->
<body>
    <main>
        <h1>Testando media Queries</h1>
        <img id="phone" src="img/icon-phone.png" alt="acessando pelo smartfhone">
        <img id="tablet" src="img/icon-tablet.png" alt="acessando pelo tablet">
        <img id="print" src="img/icon-print.png" alt="versão para impressora">
        <img id="pc" src="img/icon-pc.png" alt="acessando pelo pc">
        <img id="tv" src="img/icon-tv.png" alt="acessando pela tv">
    </main>
</body>
</html>
