<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../doug.ico" type="image/x-icon">

    <link rel="stylesheet" href="estilos/style.css" media="all">
    <link rel="stylesheet" href="estilos/retrato.css" media="screen and (orientation: portrait)">
    <link rel="stylesheet" href="estilos/paisagem.css" media="screen and (orientation: landscape)">

     <!--
        📌Media Features (principais em uso hoje)
                🔹 Tamanho da viewport

                    idth / min-width / max-width → largura da tela/viewport.

                    height / min-height / max-height → altura da tela/viewport.

                    aspect-ratio / min-aspect-ratio / max-aspect-ratio → proporção largura/altura.

                    orientation → portrait (vertical) ou landscape (horizontal).

                🔹 Resolução e exibição

                    resolution / min-resolution / max-resolution → densidade de pixels (dpi, dppx).

                    scan → tipo de varredura (progressive ou interlace).

                    grid → se o dispositivo usa tela em grade (muito raro).

                🔹 Cores

                    color / min-color / max-color → bits de cor suportados.

                    color-index → número de cores disponíveis (obsoleto na prática).

                    monochrome → níveis de cor em telas monocromáticas.

                🔹 Interação do usuário

                    hover → verifica se o dispositivo suporta hover (ex.: mouse).

                    any-hover → se algum dispositivo de entrada suporta hover.

                    pointer → precisão do ponteiro (none, coarse = dedo, fine = mouse).

                    any-pointer → se algum dispositivo de entrada possui ponteiro.

            👉 Hoje, na prática, os mais usados são: 
                    width, height, orientation, resolution, hover, pointer.        
    -->
    <title>Media Query</title>
</head>
<body>
    <h1>Mude a orientação do seu dispositivo</h1>
</body>
</html>
