<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="doug.ico" type="image/x-icon">
    <title>Formulário 004</title>
</head>
<body>
    <h1>
        Testes de Formulários
    </h1>
    <form action="cadastro.php" method="get">
        <fieldset>
            <legend>
                Dados Pessoais
            </legend>
            <p>
                <label for="inome">Nome: </label>
                <input type="text" name="nome" id="inome" required minlength="5" maxlength="20">
            </p>
            <p>
                <label for="iemail">E-Mail: </label>
                <input type="email" name="email" id="iemail" required autocomplete="email">
            </p>
            <p>
                <label for="itel">Telefone: </label>
                <input type="tel" name="tel" id="itel" required autocomplete="tel" pattern="^\(\d{2}\)\d{4,5}-\d{4,5}$" placeholder="(xx)xxxxx-xxxx">
            </p>
        </fieldset>
        <!--
            Estudar mais sobre RegEx!!

                No HTML, o atributo pattern é usado em inputs para validar valores com expressões regulares, sem precisar de JavaScript.

            Como funciona o pattern:

                O navegador valida o valor do campo antes de enviar.
                Se não bater com a expressão regular, o usuário recebe uma mensagem automática de erro.
                Pode ser usado junto com title="" para mostrar uma mensagem personalizada.

            Fieldset:
                O <fieldset> é uma tag HTML usada em formulários para agrupar campos relacionados. Ele geralmente vem acompanhado de <legend>, que é o título desse grupo.

            O que acontece:
                <fieldset> → cria uma “caixa” em volta dos inputs relacionados.
                <legend> → adiciona um título para esse grupo.
                Pode ser estilizado com CSS (border, padding, background, etc.).
        -->
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
        
    </form>
</body>
</html>
