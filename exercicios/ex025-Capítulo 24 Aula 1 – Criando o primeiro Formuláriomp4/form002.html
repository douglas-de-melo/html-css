<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="doug.ico" type="image/x-icon">
    <title>Formulário 002</title>
</head>
<body>
    <h1>
        Teste de Formulário
    </h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <p>
            <label for="iusu">Usuário: </label>
            <input type="text" name="usu" id="iusu" required minlength="5" maxlength="20" size="10" placeholder="nome do usuário" autocomplete="username">
        </p>
        <p>
            <label for="isen">Senha: </label>
            <input type="password" name="Sen" id="isen" required minlength="8" maxlength="20" placeholder="minimo 8 caracteres" autocomplete="current-password">
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
        <!--
            required:
                O atributo required é usado em campos de formulário (<input>, <select>, <textarea>) para tornar o preenchimento obrigatório antes de enviar o formulário.

            minlength/maxlength:
                Eles servem para controlar a quantidade mínima e máxima de caracteres que um usuário pode digitar em um campo de formulário.

            placehoder:
                O placeholder é um texto exibido dentro do campo de formulário (<input> ou <textarea>) como dica para o usuário sobre o que deve ser preenchido.
                Assim que o usuário começa a digitar, o texto desaparece.    
        -->
    </form>
</body>
</html>
